<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Knighty. Find your perfect stay, from business travel to holiday.">
    <meta name="theme-color" content="#ffffff">
    <title>Knighty</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23212121'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Arial' font-size='44' font-weight='700' fill='white'%3Ek%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="account-header" aria-label="Your account">
      <a id="account-login" class="account-login" href="/login">Log in</a>
      <div id="account-profile" class="account-profile" hidden>
        <img id="profile-photo" class="profile-avatar" alt="" hidden>
        <span id="profile-initials" class="profile-avatar profile-initials" aria-hidden="true"></span>
        <span id="profile-name"></span>
      </div>
    </header>
    <main>
      <section class="search-home" aria-labelledby="brand">
        <h1 id="brand" aria-label="Knighty">
          <svg class="brand-key" viewBox="465 245 322 532" aria-hidden="true"><image href="/brand.png" width="1254" height="1254" /></svg>
          <svg class="brand-name" viewBox="165 830 930 136" aria-hidden="true"><image href="/brand.png" width="1254" height="1254" /></svg>
        </h1>
        <form role="search">
          <div class="search-box">
            <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
            <label class="sr-only" for="search">Search for a location, hotel, stay or trip</label>
            <input id="search" name="q" type="text" placeholder="Search for a location or hotel... or describe the stay or trip you want to plan in as much detail as you like - and we'll start from there." autocomplete="off" maxlength="2048" aria-describedby="login-note" required>
            <label class="search-prompt" for="search" aria-hidden="true">Search for a location or hotel... or describe the stay or trip you want to plan in as much detail as you like - and we'll start from there.</label>
            <button class="clear" type="button" aria-label="Clear search" hidden>×</button>
          </div>
          <p class="login-note" id="login-note"><a class="login-link" href="/login">Log in</a> or <a class="login-link" href="/signup">Sign up</a> to match with your personal preferences.</p>
          <button class="submit" type="submit" aria-describedby="match-status" disabled>Show matches (<span id="match-count">0</span>)</button>
          <p class="match-status" id="match-status" role="status">Matching coming soon.</p>
        </form>
        <p class="note">From Business Travel to Holiday. From Eco to Ultra-Luxury. We have a match for everyone. Let us find your perfect stay, everytime.</p>
      </section>
    </main>
    <nav class="hotel-link-row" aria-label="Hotel partners"><a class="login-link" href="https://knighty.co/hotels">For Hotels</a></nav>
    <footer><a class="footer-about" href="https://knighty.co/knighty">About Knighty</a><span>Your perfect stay starts here.</span></footer>
  </body>
</html>
